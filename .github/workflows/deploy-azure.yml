name: Build image and push to Azure


on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  REGISTRY: crcomplaint18922.azurecr.io
  IMAGE: complaint-processor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for the layer cache below - the runner's default builder
      # cannot export a cache and the build fails without this step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: crcomplaint18922.azurecr.io
          username: crcomplaint18922
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
